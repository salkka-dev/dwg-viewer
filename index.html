<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1016" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="도면뷰어" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>도면 뷰어</title>
  </head>
  <body>
    <div id="app" class="no-doc">
      <header class="topbar">
        <button class="tool-btn" id="btn-open" type="button" title="파일 열기 (Ctrl+O)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
          <span class="tool-label">열기</span>
        </button>
        <div class="doc-title" id="doc-title">도면 뷰어</div>
        <div class="tool-group">
          <button class="tool-btn needs-doc" id="btn-fit" type="button" title="화면에 맞추기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
            <span class="tool-label">맞춤</span>
          </button>
          <button class="tool-btn needs-doc" id="btn-layers" type="button" title="레이어">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5zM2 13l10 5 10-5M2 18l10 5 10-5" /></svg>
            <span class="tool-label">레이어</span>
          </button>
          <button class="tool-btn needs-doc" id="btn-bg" type="button" title="배경색 바꾸기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 3a9 9 0 0 0 0 18z" class="fill" /></svg>
            <span class="tool-label">배경</span>
          </button>
          <button class="pdf-btn needs-doc" id="btn-pdf" type="button" title="PDF로 변환">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z" /><path d="M14 3v5h5M10 13h6M10 17h4" /></svg>
            <span>PDF</span>
          </button>
        </div>
      </header>

      <main class="stage" id="stage">
        <div id="cad-host"></div>

        <section class="home" id="home">
          <div class="home-card">
            <img class="home-icon" src="./icons/icon-192.png" alt="" width="88" height="88" />
            <h1>도면 뷰어</h1>
            <p class="home-sub">
              DWG, DXF 도면을 열어 보고 페이지별 PDF로 바꿉니다.<br />
              파일은 이 기기 안에서만 처리되고 어디에도 올라가지 않아요.
            </p>
            <button class="big-btn" id="btn-open-home" type="button">파일 열기</button>
            <div class="recent" id="recent-wrap" hidden>
              <h2>최근 연 파일</h2>
              <ul id="recent-list"></ul>
            </div>
          </div>
        </section>

        <div class="busy" id="busy" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <span id="busy-text">여는 중</span>
        </div>
        <div class="drop-hint" id="drop-hint" hidden>여기에 놓으면 열려요</div>
      </main>

      <nav class="layout-bar" id="layout-bar" hidden></nav>

      <aside class="panel" id="layer-panel" hidden>
        <header class="panel-head">
          <h2>레이어 <small id="layer-count"></small></h2>
          <button class="close-btn" id="layer-close" type="button" aria-label="닫기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <div class="panel-tools">
          <input type="search" id="layer-search" placeholder="레이어 이름 검색" autocomplete="off" />
          <button class="ghost-btn" id="layer-all-on" type="button">모두 켜기</button>
        </div>
        <ul class="layer-list" id="layer-list"></ul>
      </aside>

      <div class="sheet-backdrop" id="pdf-sheet" hidden>
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pdf-title">
          <header class="sheet-head">
            <h2 id="pdf-title">PDF로 변환</h2>
            <button class="close-btn" id="pdf-close" type="button" aria-label="닫기">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
            </button>
          </header>
          <div class="sheet-body">
            <p class="hint" id="pdf-summary"></p>
            <div class="list-tools">
              <span id="sel-count"></span>
              <button class="ghost-btn" id="sel-all" type="button">전체 선택</button>
              <button class="ghost-btn" id="sel-none" type="button">선택 해제</button>
            </div>
            <ul class="page-list" id="page-list"></ul>

            <div class="options">
              <div class="opt-row">
                <span class="opt-name">용지</span>
                <div class="seg" id="opt-paper" role="radiogroup">
                  <button type="button" data-v="original">원본 크기</button>
                  <button type="button" data-v="A4">A4</button>
                  <button type="button" data-v="A3">A3</button>
                  <button type="button" data-v="A2">A2</button>
                  <button type="button" data-v="A1">A1</button>
                </div>
              </div>
              <div class="opt-row">
                <span class="opt-name">색상</span>
                <div class="seg" id="opt-color" role="radiogroup">
                  <button type="button" data-v="mono">흑백</button>
                  <button type="button" data-v="color">컬러</button>
                </div>
              </div>
              <label class="opt-row check">
                <input type="checkbox" id="opt-lw" checked />
                <span>선 굵기 반영</span>
              </label>
            </div>

            <div class="progress" id="pdf-progress" hidden>
              <div class="bar"><i id="pdf-bar"></i></div>
              <span id="pdf-progress-text"></span>
            </div>

            <div class="results" id="pdf-results" hidden></div>
          </div>
          <footer class="sheet-foot">
            <button class="big-btn" id="pdf-run" type="button">PDF 만들기</button>
          </footer>
        </div>
      </div>

      <div class="toast" id="toast" role="status" hidden></div>
      <input type="file" id="file-input" hidden />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
